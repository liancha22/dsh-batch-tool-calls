name: publish

# 打 v* 标签时：
#   1) 发布到 npm —— 走 Trusted Publishing（OIDC），仓库里不存任何 npm token
#   2) 建一个 GitHub Release，并附上 npm pack 出来的 .tgz
#      （这样别人也能用 DSH 的「从 Release 安装」：plugin-manager.py release <owner> <repo> latest）
# 首次发布会失败，因为 npm 上还没有这个包、也就绑不了 Trusted Publisher ——
# 先在本机手动发一次（需要 2FA 验证码），再去 npm 包设置里绑定，详见 PUBLISH.md。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # Trusted Publishing（OIDC）必需
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false   # 发布构建不要用依赖缓存
      # Trusted Publishing 要求 npm CLI >= 11.5.1（Node 24 自带的可能更旧）
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: 校验标签与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const pkg = require("./package.json");
            const tag = process.env.TAG.replace(/^v/, "");
            if (tag !== pkg.version) {
              console.error("标签 " + process.env.TAG + " 和 package.json 的 " + pkg.version + " 不一致，已停止发布");
              process.exit(1);
            }
            console.log("版本一致：" + pkg.version);
          '
      - name: 发布到 npm
        env:
          # OIDC（Trusted Publishing）优先；还没绑定 Trusted Publisher 时自动回退到这个 token。
          # 绑好之后可以删掉这个 secret 和这两行（见 PUBLISH.md）。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

  release:
    needs: npm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm pack
      - name: 建 Release 并附上 .tgz
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --generate-notes --verify-tag
